micronaut:
  application:
    name: clean-shop
  server:
    # 9001 (not 9000) so this can run side-by-side with the hexagonal example for comparison.
    port: 9001
    # cap request body to blunt oversized-payload abuse (pentest)
    max-request-size: 512KB
    cors:
      enabled: false
  # Serve the OpenAPI spec + the bundled doc UIs generated by micronaut-openapi at build time.
  # All assets live on the classpath (no CDN). In production, gate these behind auth or disable.
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      redoc:
        paths: classpath:META-INF/swagger/views/redoc
        mapping: /redoc/**
      rapidoc:
        paths: classpath:META-INF/swagger/views/rapidoc
        mapping: /rapidoc/**

datasources:
  default:
    # 5433 host port (compose maps 5433->5432) so it won't clash with the hexagonal db.
    # `./gradlew run` starts this db automatically (see composeUpDb in build.gradle.kts).
    url: ${DB_URL:`jdbc:postgresql://localhost:5433/shop`}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 20

flyway:
  datasources:
    default:
      enabled: true
      locations:
        - classpath:db/migration

# Keep the management surface tiny: only health, and only non-sensitive details.
endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
