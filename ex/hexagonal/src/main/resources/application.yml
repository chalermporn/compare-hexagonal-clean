micronaut:
  application:
    name: hexagonal-shop
  server:
    port: 8080
    # cap request body to blunt oversized-payload abuse (pentest)
    max-request-size: 512KB
    cors:
      enabled: false

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/shop`}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    maximum-pool-size: 20

flyway:
  datasources:
    default:
      enabled: true
      locations:
        - classpath:db/migration

# Keep the management surface tiny: only health, and only non-sensitive details.
endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
